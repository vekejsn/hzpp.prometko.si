<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapLibre + MOTIS Realtime</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="info-panel" style="display: none;">
    <div id="info-panel-content"></div>
</div>
<div id="search-container">
    <input type="text" id="search-input" placeholder="Search for a stop or route...">
    <div id="search-results"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
<script src="js/router.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
  center: [20.3, 44.5],
  zoom: 7
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true
}));

const vehicleSourceId = 'realtime-vehicles';
const stopsSourceId = 'stops';
let stopsLoaded = false;

async function loadStops() {
    const url = `http://mapper-motis:8080/api/v1/map/stops?min=49.415360776528956%2C7.898969151846785&max=36.38523043114108%2C26.9347879737411&zoom=20`;
    const res = await fetch(url);
    const stopsData = await res.json();

    const stopsGeoJSON = {
        type: 'FeatureCollection',
        features: stopsData.map(stop => ({
            type: 'Feature',
            geometry: {
                type: 'Point',
                coordinates: [stop.lon, stop.lat]
            },
            properties: {
                id: stop.stopId,
                name: stop.name,
                parentId: null // parentId is not available in the new API
            }
        }))
    };

    localStorage.setItem('zetkoStops', JSON.stringify(stopsGeoJSON));
    map.getSource(stopsSourceId).setData(stopsGeoJSON);
    stopsLoaded = true;
    return stopsGeoJSON;
}

map.on('load', async () => {
  map.addSource(vehicleSourceId, {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });

  map.addSource(stopsSourceId, {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });

  await loadStops();

  map.addLayer({
      id: 'stops-layer',
      type: 'circle',
      source: stopsSourceId,
      paint: {
          'circle-radius': 5,
          'circle-color': '#007cbf',
          'circle-stroke-width': 1,
          'circle-stroke-color': '#ffffff'
      }
  });

  map.on('click', 'stops-layer', (e) => {
      const stop = e.features[0].properties;
      goToStop({ stop_id: stop.id, stop_name: stop.name, parent_station: stop.parentId });
  });

   map.on('click', 'realtime-vehicles-fg', (e) => {
        const tripId = e.features[0].properties.tripId;
        goToTrip(tripId);
    });

  map.on('mouseenter', 'stops-layer', () => {
      map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', 'stops-layer', () => {
      map.getCanvas().style.cursor = '';
  });

  map.on('mouseenter', 'realtime-vehicles-fg', () => {
      map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', 'realtime-vehicles-fg', () => {
      map.getCanvas().style.cursor = '';
  });

  map.on('styleimagemissing', async (e) => {
    const id = e.id;
    if (!id.endsWith('-fg')) return;

    const [routeShortName, routeTypeStr, realTimeStr] = id.split('-');
    const routeType = parseInt(routeTypeStr, 10);
    const realTime = realTimeStr === 'true';

    const color = !realTime ? '#535353' : routeType === 3 ? '#126400' : '#1264AB';
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const center = canvas.width / 2;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px sans-serif';

    const metrics = ctx.measureText(routeShortName);
    const textWidth = metrics.width;
    const textHeight = (metrics.actualBoundingBoxAscent || 12) + (metrics.actualBoundingBoxDescent || 4);
    const horizontalPadding = 12;
    const verticalPadding = 6;

    const pillWidth = Math.max(textWidth + 2 * horizontalPadding, 48);
    const pillHeight = Math.max(textHeight + 2 * verticalPadding, 24);
    const pillX = center - pillWidth / 2;
    const pillY = center - pillHeight / 2;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pillX + pillHeight / 2, pillY);
    ctx.lineTo(pillX + pillWidth - pillHeight / 2, pillY);
    ctx.arc(pillX + pillWidth - pillHeight / 2, pillY + pillHeight / 2, pillHeight / 2, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(pillX + pillHeight / 2, pillY + pillHeight);
    ctx.arc(pillX + pillHeight / 2, pillY + pillHeight / 2, pillHeight / 2, Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = darkenColor(color, 0.8);
    ctx.stroke();

    ctx.fillStyle = 'white';
    ctx.fillText(routeShortName, center, pillY + pillHeight / 2);

    map.addImage(id, {
      width: canvas.width,
      height: canvas.height,
      data: ctx.getImageData(0, 0, canvas.width, canvas.height).data
    });
  });

  map.addLayer({
    id: 'realtime-vehicles-fg',
    type: 'symbol',
    source: vehicleSourceId,
    layout: {
      'icon-image': [
        'concat',
        ['get', 'routeShortName'], '-',
        ['get', 'routeType'], '-',
        ['to-string', ['get', 'realTime']], '-fg'
      ],
      'icon-size': 0.65,
      'icon-allow-overlap': true,
      'text-allow-overlap': true,
      'symbol-sort-key': ['*', ['get', 'id'], 2],
      'symbol-z-order': 'source'
    }
  });

  fetchTrips();
  setInterval(fetchTrips, 30000);
  animate();
});

function darkenColor(hex, factor = 0.8) {
  const r = Math.floor(parseInt(hex.slice(1, 3), 16) * factor);
  const g = Math.floor(parseInt(hex.slice(3, 5), 16) * factor);
  const b = Math.floor(parseInt(hex.slice(5, 7), 16) * factor);
  return `rgb(${r},${g},${b})`;
}

let tripsWithTiming = [];

function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0, coordinates = [], shift, result, byte;
  const factor = 1e5;
  while (index < str.length) {
    shift = result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lat += dlat;

    shift = result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lng += dlng;

    coordinates.push([lng / factor, lat / factor]);
  }
  return coordinates;
}

function buildTimedPath(coords, departure, arrival) {
  const totalDuration = arrival - departure;
  let totalDistance = 0;
  const distances = [];

  for (let i = 0; i < coords.length - 1; i++) {
    const dx = coords[i + 1][0] - coords[i][0];
    const dy = coords[i + 1][1] - coords[i][1];
    const dist = Math.sqrt(dx * dx + dy * dy);
    distances.push(dist);
    totalDistance += dist;
  }

  const times = [departure];
  let accTime = 0;
  for (let d of distances) {
    accTime += (d / totalDistance) * totalDuration;
    times.push(departure + accTime);
  }

  return coords.map((point, i) => ({ point, time: times[i] }));
}

function calculateBearing(from, to) {
  const dx = to[0] - from[0];
  const dy = to[1] - from[1];
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}

function getInterpolatedPosition(timedPath, now) {
  const i = timedPath.findIndex(p => p.time > now);
  if (i <= 0) return { coord: timedPath[0].point, bearing: 0 };
  if (i === -1) {
    if (timedPath.length > 1) {
      const last = timedPath[timedPath.length - 1];
      const prev = timedPath[timedPath.length - 2];
      const bearing = calculateBearing(prev.point, last.point);
      return { coord: last.point, bearing };
    } else {
      return { coord: timedPath[timedPath.length - 1].point, bearing: 0 };
    }
  }

  const p1 = timedPath[i - 1];
  const p2 = timedPath[i];
  const t = (now - p1.time) / (p2.time - p1.time);

  const lon = p1.point[0] + (p2.point[0] - p1.point[0]) * t;
  const lat = p1.point[1] + (p2.point[1] - p1.point[1]) * t;
  const bearing = calculateBearing(p1.point, p2.point);

  return { coord: [lon, lat], bearing };
}

async function fetchTrips() {
  const now = new Date();
  const later = new Date(now.getTime() + 30000);

  const url = `http://mapper-motis:8080/api/v1/map/trips?min=49.415360776528956%2C7.898969151846785&max=36.38523043114108%2C26.93478797374118&startTime=${encodeURIComponent(now.toISOString())}&endTime=${encodeURIComponent(later.toISOString())}&zoom=20`;

  const res = await fetch(url);
  const data = await res.json();

  tripsWithTiming = data.map(item => {
    const coords = decodePolyline(item.polyline);
    const tripId = item.trips?.[0]?.tripId || '';
    const route = item.trips?.[0]?.routeShortName.split(' ').join('') || '?';
    const departure = new Date(item.departure).getTime();
    const arrival = new Date(item.arrival).getTime();
    const path = buildTimedPath(coords, departure, arrival);
    return { tripId, route, path };
  });
}

function animate() {
  const now = Date.now();
  const features = tripsWithTiming.map(({ tripId, route, path }) => {
    const { coord, bearing } = getInterpolatedPosition(path, now);
    return {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: coord
      },
      properties: {
        id: tripId,
        tripId,
        routeShortName: route,
        routeType: 3,
        realTime: true,
        bearing
      }
    };
  });

  const geojson = {
    type: 'FeatureCollection',
    features
  };

  if (map.getSource(vehicleSourceId)) {
    map.getSource(vehicleSourceId).setData(geojson);
  }

  setTimeout(() => {
      requestAnimationFrame(animate);
  }, 100);
}
</script>
</body>
</html>
